spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pizzaria}
spring.data.mongodb.database=${MONGODB_DATABASE:pizzaria}
app.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

server.error.include-message=never
server.error.include-stacktrace=never
