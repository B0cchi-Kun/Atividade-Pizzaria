<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<body>
<div th:fragment="content">
    <div class="mb-4">
        <h2 class="fw-bold mb-1"><i class="bi bi-person-raised-hand me-2 text-primary"></i>Clientes</h2>
        <p class="text-muted mb-0">Dados cadastrais e contatos usados para registrar pedidos.</p>
    </div>
    <div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}"></div>
    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>
    <a th:if="${isAtendente}" th:href="@{/clientes/novo}" class="btn btn-primary mb-3"><i class="bi bi-plus-lg me-1"></i>Novo cliente</a>
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark"><tr><th class="ps-3">Nome</th><th>Telefone</th><th>Endereço</th><th>Ações</th></tr></thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(clientes)}"><td colspan="4" class="text-center text-muted py-5">Nenhum cliente cadastrado.</td></tr>
                    <tr th:each="cliente : ${clientes}">
                        <td class="ps-3" th:text="${cliente.nome}"></td>
                        <td th:text="${cliente.telefone}"></td>
                        <td th:text="${(cliente.logradouro ?: cliente.endereco ?: '') + ' ' + (cliente.numero ?: '') + ', ' + (cliente.bairro ?: '') + ' — ' + (cliente.cidade ?: '') + '/' + (cliente.estado ?: '')}"></td>
                        <td class="text-nowrap">
                            <a th:if="${isAtendente}" th:href="@{/clientes/editar/{id}(id=${cliente.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
                            <form th:if="${isGerente}" th:action="@{/clientes/deletar/{id}(id=${cliente.id})}" method="post" class="d-inline" onsubmit="return confirm('Excluir este cliente?')">
                                <button class="btn btn-sm btn-outline-danger" type="submit">Excluir</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small">Os acessos e alterações cadastrais são auditados no sistema.</div>
    </div>
</div>
</body>
</html>
