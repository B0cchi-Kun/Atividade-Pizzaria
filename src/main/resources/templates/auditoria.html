<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<body>
<div th:fragment="content">
    <div class="mb-4">
        <h2 class="fw-bold mb-1"><i class="bi bi-clock-history me-2 text-primary"></i>Auditoria</h2>
        <p class="text-muted mb-0">Últimos 500 eventos. Os registros são somente para consulta.</p>
    </div>
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark"><tr><th class="ps-3">Data e hora</th><th>Usuário / perfil</th><th>Operação</th><th>Entidade</th><th>Valores anteriores</th><th>Valores novos</th><th>Justificativa</th></tr></thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(eventos)}"><td colspan="7" class="text-center text-muted py-5">Nenhum evento de auditoria registrado.</td></tr>
                    <tr th:each="evento : ${eventos}">
                        <td class="ps-3" th:text="${evento.dataHora}"></td>
                        <td><span th:text="${evento.usuario}"></span><br><small class="text-muted" th:text="${evento.perfil}"></small></td>
                        <td th:text="${evento.tipoOperacao}"></td>
                        <td><span th:text="${evento.entidade}"></span><br><small class="text-muted" th:text="${evento.entidadeId}"></small></td>
                        <td><code th:text="${evento.valoresAnteriores}"></code></td>
                        <td><code th:text="${evento.valoresNovos}"></code></td>
                        <td th:text="${evento.justificativa ?: '—'}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
