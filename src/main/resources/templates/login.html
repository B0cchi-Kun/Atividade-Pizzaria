<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar — Pediu Patrão</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body{background:#f5f6f8}.login-card{max-width:420px;width:100%;border:0;border-radius:18px}</style>
</head>
<body class="min-vh-100 d-flex align-items-center justify-content-center p-3">
    <main class="card login-card shadow-sm p-4 p-md-5">
        <div class="text-center mb-4"><div class="display-5">🍕</div><h1 class="h3 fw-bold">Pediu Patrão</h1><p class="text-muted mb-0">Entre com sua conta de funcionário.</p></div>
        <div class="alert alert-danger" th:if="${param.error}">Usuário ou senha inválidos.</div>
        <div class="alert alert-success" th:if="${param.logout}">Sessão encerrada.</div>
        <form th:action="@{/login}" method="post">
            <div class="mb-3"><label class="form-label" for="username">Usuário</label><input class="form-control" id="username" name="username" autocomplete="username" required autofocus></div>
            <div class="mb-4"><label class="form-label" for="password">Senha</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div>
            <button class="btn btn-primary w-100" type="submit">Entrar</button>
        </form>
    </main>
</body>
</html>
