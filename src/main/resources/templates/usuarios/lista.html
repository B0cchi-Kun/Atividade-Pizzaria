<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1"><i class="bi bi-people-fill me-2 text-primary"></i>Usuários</h2>
            <p class="text-muted mb-0">Contas e perfis de acesso da equipe.</p>
        </div>
        <a th:href="@{/usuarios/novo}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Novo usuário</a>
    </div>
    <div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}"></div>
    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark"><tr><th class="ps-3">Usuário</th><th>Perfil</th><th>Ações</th></tr></thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(usuarios)}"><td colspan="3" class="text-center text-muted py-5">Nenhum usuário cadastrado.</td></tr>
                    <tr th:each="usuario : ${usuarios}">
                        <td class="ps-3" th:text="${usuario.username}"></td>
                        <td><span class="badge bg-secondary" th:text="${usuario.role}"></span></td>
                        <td class="text-nowrap">
                            <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
                            <form th:if="${currentUser != usuario.username}" th:action="@{/usuarios/deletar/{id}(id=${usuario.id})}" method="post" class="d-inline" onsubmit="return confirm('Excluir esta conta?')">
                                <button class="btn btn-sm btn-outline-danger" type="submit">Excluir</button>
                            </form>
                            <span th:if="${currentUser == usuario.username}" class="text-muted small">Conta atual</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer small text-muted">Somente ADMIN pode criar contas ou atribuir perfis.</div>
    </div>
</div>
</body>
</html>
