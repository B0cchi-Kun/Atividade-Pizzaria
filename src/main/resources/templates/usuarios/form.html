<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<body>
<div th:fragment="content">
    <div class="d-flex align-items-center gap-3 mb-4">
        <a th:href="@{/usuarios}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i></a>
        <h2 class="fw-bold mb-0" th:text="${usuario.id != null ? 'Editar usuário' : 'Novo usuário'}"></h2>
    </div>
    <div class="card shadow-sm" style="max-width: 600px">
        <div class="card-body p-4">
            <form th:action="${usuario.id != null} ? @{/usuarios/editar/{id}(id=${usuario.id})} : @{/usuarios/salvar}" th:object="${usuario}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Nome de usuário</label>
                    <input id="username" class="form-control" th:field="*{username}" minlength="3" maxlength="80" autocomplete="username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Senha <small class="text-muted" th:if="${usuario.id != null}">Deixe em branco para manter a senha atual.</small></label>
                    <input id="password" class="form-control" type="password" th:field="*{password}" th:required="${usuario.id == null}" minlength="8" autocomplete="new-password">
                </div>
                <div class="mb-4">
                    <label for="role" class="form-label">Perfil</label>
                    <select id="role" class="form-select" th:field="*{role}" required>
                        <option value="" disabled>Selecione um perfil</option>
                        <option th:each="perfil : ${perfis}" th:value="${perfil.name()}" th:text="${perfil.name()}"></option>
                    </select>
                </div>
                <div class="alert alert-info small">O formulário só aceita ADMIN, GERENTE e ATENDENTE. A API também valida o perfil no servidor.</div>
                <div class="d-flex gap-2">
                    <button class="btn btn-primary" type="submit">Salvar usuário</button>
                    <a th:href="@{/usuarios}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
